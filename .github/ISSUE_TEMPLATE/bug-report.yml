name: Bug report
description: Report a defect, regression, or incorrect behavior in OrchFlow.
title: "[Bug]: "
labels:
  - type:bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the bug clearly and directly.
      placeholder: A short explanation of the problem.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain where the problem appears and what area it affects.
      placeholder: API, CLI, core behavior, docs, CI, or another area.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what actually happened.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Add logs, screenshots, traces, or any other useful evidence.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Choose the impact level of this bug.
      options:
        - high
        - medium
        - low
    validations:
      required: true
