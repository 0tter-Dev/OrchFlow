name: OrchFlow - Release Validation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate, for example v0.3.18"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Validate Tag And Generate Notes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Validate release tag
        run: uv run python scripts/release.py validate-tag --tag "${{ inputs.tag }}"

      - name: Generate release notes
        run: uv run python scripts/release.py generate-notes --tag "${{ inputs.tag }}" --output runtime/release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchflow-release-notes-${{ inputs.tag }}
          path: runtime/release-notes.md
          if-no-files-found: error
