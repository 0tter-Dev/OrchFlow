[project]
name = "orchflow"
version = "0.2.14"
description = "Local-first project lifecycle orchestrator with CLI, API, UI, and AI-assisted bat generation."
readme = "README.md"
authors = [
    { name = "0tter-Dev", email = "g4br13l.llanir@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "bcrypt>=4.3.0",
    "fastapi>=0.117.1",
    "litellm>=1.98.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.10.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.43",
    "typer>=0.17.4",
    "uvicorn[standard]>=0.36.0",
]

[project.scripts]
orchflow = "orchflow.external.cli.app:run"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=1.17.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["orchflow"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
